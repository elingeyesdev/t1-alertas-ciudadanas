<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    Alias /storage/reports/ /var/www/html/storage/app/public/reports/
    Alias /storage/report-videos/ /var/www/html/storage/app/public/report-videos/
    <Directory /var/www/html/storage/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} (^|/)\.
        RewriteRule ^ - [F,L]
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
