services:
  app:
    image: alertas-ciudadanas-app:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Set APP_KEY in the selected environment file}
      APP_URL: ${APP_URL:?Set APP_URL in the selected environment file}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-alertas}
      DB_USERNAME: ${DB_USERNAME:-alertas}
      DB_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in the selected environment file}
      DB_URL: ""
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      JWT_SECRET: ${JWT_SECRET:?Set a JWT_SECRET in the selected environment file}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public
      - runtime-storage:/var/www/html/storage/framework
      - runtime-cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); exit($$s ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-alertas}
      POSTGRES_USER: ${DB_USERNAME:-alertas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in the selected environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  uploads:
  runtime-storage:
  runtime-cache:
